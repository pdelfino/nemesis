<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>headings</title>
  </head>
  <body>
    <!--
      The jump-to-heading fixture (#176): three headings of two levels, far
      enough apart that the third is below the first viewport.
    -->
    <main>
      <h1>First heading</h1>
      <div style="height: 3000px"></div>
      <h2>Second heading</h2>
      <div style="height: 3000px"></div>
      <h2 id="third">Third heading</h2>
      <div style="height: 3000px"></div>
    </main>
  </body>
</html>
