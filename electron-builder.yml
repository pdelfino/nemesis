# electron-builder configuration. `npm run package` builds a local, unsigned
# release/mac-arm64/Nemesis.app (#35); signing and notarization are #36. The
# afterPack hook flips the Electron fuses before the app is signed
# (SECURITY.org T1, #47).
appId: com.pdelfino.nemesis
productName: Nemesis
afterPack: scripts/after-pack.mjs
# OnlyLoadAppFromAsar and EnableEmbeddedAsarIntegrityValidation are fuses about
# the asar, so there has to be one.
asar: true
directories:
  output: release
files:
  - out/**/*
  - package.json
# The SDK spawns its native CLI binary, and a file inside the asar cannot be
# executed, so it is unpacked next to it (src/main/agent/session.ts points the
# SDK at the unpacked copy).
asarUnpack:
  - node_modules/@anthropic-ai/claude-agent-sdk-*/claude
  - node_modules/@anthropic-ai/claude-agent-sdk-*/claude.exe
mac:
  target: dir
  # Signing (#36). `npm run package` signs nothing (CSC_IDENTITY_AUTO_DISCOVERY
  # is off), so these apply only to `npm run package:signed`, a Developer ID
  # build that is then notarized, and `npm run package:hardened`, an ad hoc
  # local check. The hardened runtime with one entitlement, allow-jit.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # The Agent SDK's CLI binary already carries Anthropic's Developer ID
  # signature, hardened, with a secure timestamp and the entitlements it runs
  # with (JIT, unsigned executable memory, library validation off, microphone,
  # Apple Events). Re-signing it with ours would strip those, so it keeps its own.
  signIgnore:
    - 'claude-agent-sdk-darwin-[^/]+/claude$'
  # Turned on by `npm run package:signed` only, with the App Store Connect API
  # key from the environment (APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER).
  notarize: false
