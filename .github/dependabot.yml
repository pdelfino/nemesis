version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      electron:
        patterns:
          - 'electron'
          - 'electron-*'
          - '@electron/*'
    ignore:
      # Types track the pinned runtime (.nvmrc = Node 24).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # typescript-eslint pins TypeScript below 6.1; revisit when it supports 7.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
