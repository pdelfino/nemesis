name: ci

# Local-first: the full gate runs on every commit on the developer's machine,
# and this workflow runs there too before anything is pushed (`make ci`, act
# on the host; see CONTRIBUTING.org). Actions is the second opinion: on main,
# on a tag, and on a pull request once it is ready for review. A draft runs
# nothing here, so a queue pushing every commit of a stack costs no minutes
# (Pedro, 2026-OCTOBER-19: "always local first is better for cost reasons").

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  secrets:
    name: secret scan (gitleaks)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  gate:
    name: typecheck, lint, test, audit
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # macOS: the app targets macOS and Playwright drives the real Electron
    # binary, which needs a display that Linux runners lack without xvfb.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # Until application code lands (milestone M1), package.json does not
      # exist and this job passes trivially. The steps below switch on the
      # moment it appears.
      - id: code
        run: |
          if [ -f package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - if: steps.code.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Supply chain rule: no lifecycle scripts from dependencies. Electron's
      # own binary download is the single explicit exception.
      - if: steps.code.outputs.present == 'true'
        run: npm ci --ignore-scripts
      - if: steps.code.outputs.present == 'true'
        run: node node_modules/electron/install.js

      - if: steps.code.outputs.present == 'true'
        run: npm run gate

      - if: steps.code.outputs.present == 'true'
        run: npm audit --audit-level=high
