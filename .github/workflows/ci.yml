name: ci

# Local-first: the full gate runs on every commit on the developer's machine
# (see CONTRIBUTING.org). Actions is the second opinion at ready-for-review.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  gate:
    name: typecheck, lint, test, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Until application code lands (milestone M1), package.json does not
      # exist and this job passes trivially. The steps below switch on the
      # moment it appears.
      - id: code
        run: |
          if [ -f package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - if: steps.code.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Supply chain rule: no lifecycle scripts from dependencies. Electron's
      # own binary download is the single explicit exception.
      - if: steps.code.outputs.present == 'true'
        run: npm ci --ignore-scripts
      - if: steps.code.outputs.present == 'true'
        run: node node_modules/electron/install.js

      - if: steps.code.outputs.present == 'true'
        run: npm run gate

      - if: steps.code.outputs.present == 'true'
        run: npm audit --audit-level=high
