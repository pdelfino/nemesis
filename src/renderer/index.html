<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      The policy the built page gets as a response header on nemesis://app
      (src/main/security/internal-scheme.ts, #50), repeated here for the Vite
      dev server, which serves this file over http://localhost without it.
      ws://localhost:* exists only for that server's hot reload.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws://localhost:*; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nemesis</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header id="modeline">
      <span id="app-name">Nemesis</span>
      <span id="app-version"></span>
      <!-- The session's name (#104): shown while the named session is up, cut where the line runs out of room. -->
      <span id="session-name" aria-label="session name"></span>
      <!-- The buffer list, current buffer in brackets (#60). -->
      <span id="buffer-list" aria-label="buffer list"></span>
      <!-- The current page buffer's committed URL (#119); a loopback plain http: page shows its scheme in red. -->
      <span id="page-url" aria-label="page url"></span>
      <!-- The current page buffer's state (#120): passthrough while on, the zoom when it is not 100%. -->
      <span id="page-state" aria-label="page state"></span>
      <!-- The permission mode (#82): default until the session says otherwise; C-c C-p toggles plan. -->
      <span
        id="permission-mode"
        aria-label="permission mode"
        title="Permission mode. C-c C-p toggles plan mode."
        >default</span
      >
      <!-- The context meter (#80): fill of the window as a fraction and a bar. -->
      <span id="context-meter" aria-label="context" data-level="none"></span>
      <!-- The eval journal (#72): how many definitions wait to be promoted to init.ts; blank at none. -->
      <span id="journal-count" aria-label="journal"></span>
      <!-- The cockpit's nudge (#80): shown until the next prompt. -->
      <span id="modeline-hint" aria-label="hint"></span>
    </header>
    <main>
      <!--
        A page buffer (#119): an empty section the main process covers with the
        current page's own view, at the rectangle this page reports. It takes
        the transcript's place while a page buffer is current.
      -->
      <section id="page" aria-label="page" data-buffer-type="page" tabindex="-1" hidden></section>
      <section id="transcript" aria-label="transcript" data-buffer-type="transcript">
        <!-- A read-only CodeMirror document of the session (#62). -->
        <div id="transcript-editor"></div>
      </section>
      <!-- A plan buffer (#82): the agent's plan as editable text, shown while one awaits an answer. -->
      <section id="plan" aria-label="plan" data-buffer-type="plan" hidden>
        <div id="plan-editor"></div>
        <p id="plan-keys" class="placeholder"></p>
      </section>
      <!-- A spec buffer (#85): the spec the agent wrote, read-only, shown while one is open. -->
      <section id="spec" aria-label="spec" data-buffer-type="spec" hidden>
        <p id="spec-file"></p>
        <div id="spec-editor"></div>
        <p id="spec-keys" class="placeholder"></p>
      </section>
      <!-- A review buffer (#87): the reviewer window's findings on the diff, read-only, shown while one is open. -->
      <section id="review" aria-label="review" data-buffer-type="review" hidden>
        <p id="review-from"></p>
        <div id="review-editor"></div>
        <p id="review-keys" class="placeholder"></p>
      </section>
      <!-- The environment buffer (#86): the session's CLAUDE.md files, rules, hooks, skills, servers and subagents, read-only. -->
      <section id="environment" aria-label="environment" data-buffer-type="environment" hidden>
        <div id="environment-editor"></div>
        <p id="environment-keys" class="placeholder"></p>
      </section>
      <!-- The *repl* buffer (#72): forms evaluated in the config scope and their values, read-only. -->
      <section id="repl" aria-label="repl" data-buffer-type="repl" hidden>
        <div id="repl-editor"></div>
        <p id="repl-keys" class="placeholder"></p>
      </section>
      <!-- The help buffer (#65): a read-only document, shown while a help buffer exists. -->
      <section id="help" aria-label="help" data-buffer-type="help" hidden>
        <div id="help-editor"></div>
      </section>
      <!-- A diff buffer (#68): one Edit or Write of the session, shown while one is open. -->
      <section id="diff" aria-label="diff" data-buffer-type="diff" hidden>
        <p id="diff-file"></p>
        <div id="diff-editor"></div>
        <p id="diff-keys" class="placeholder"></p>
      </section>
      <!--
        A pending permission request or question (#63). Shown while a request
        buffer exists; it holds the point so y, n, a and a digit are answers.
      -->
      <section
        id="request"
        aria-label="pending request"
        data-buffer-type="permission"
        tabindex="-1"
        hidden
      >
        <p id="request-title"></p>
        <ol id="request-options" aria-label="options"></ol>
        <p id="request-keys" class="placeholder"></p>
      </section>
      <section id="prompt" aria-label="prompt buffer" data-buffer-type="prompt">
        <!-- CodeMirror mounts here (#61). -->
        <div id="prompt-editor"></div>
        <p id="prompt-status" class="placeholder">
          <span id="prompt-note"></span>
          <span id="prompt-agent"></span>
        </p>
        <!-- One line per prompt waiting for the agent. -->
        <ol id="prompt-queued" aria-label="queued prompts"></ol>
      </section>
      <!--
        The palette (#65): the prompt buffer in command mode. Takes the prompt
        section's place while the main process reads a choice.
      -->
      <div id="palette" aria-label="palette" hidden>
        <div id="palette-line">
          <span id="palette-prompt"></span>
          <div id="palette-input"></div>
        </div>
        <ol id="palette-candidates" aria-label="candidates"></ol>
        <p id="palette-doc" class="placeholder"></p>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
