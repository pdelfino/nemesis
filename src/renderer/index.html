<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Interim policy as a meta tag; #50 serves internal pages from nemesis://
      with the same policy as a response header. ws://localhost:* exists only
      for the Vite dev server's hot reload.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws://localhost:*; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nemesis</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header id="modeline">
      <span id="app-name">Nemesis</span>
      <span id="app-version"></span>
      <!-- The buffer list, current buffer in brackets (#60). -->
      <span id="buffer-list" aria-label="buffer list"></span>
    </header>
    <main>
      <section id="transcript" aria-label="transcript" data-buffer-type="transcript">
        <!-- A read-only CodeMirror document of the session (#62). -->
        <div id="transcript-editor"></div>
      </section>
      <section id="prompt" aria-label="prompt buffer" data-buffer-type="prompt">
        <!-- CodeMirror mounts here (#61). -->
        <div id="prompt-editor"></div>
        <p id="prompt-status" class="placeholder">
          <span id="prompt-note"></span>
          <span id="prompt-agent"></span>
        </p>
        <!-- One line per prompt waiting for the agent. -->
        <ol id="prompt-queued" aria-label="queued prompts"></ol>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
